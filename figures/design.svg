<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Design: methods comparison</title><desc id="fd-desc">A methods comparison (N = 100 analysed). The respondents are LLM-generated (Gemini (persona generation; exact version recorded in the run files under data/raw)). Methods compared: Direct persona-conditioned thermometer generation (Bisbee et al. 2024 prompt, updated for 2024), Zaller 8-&gt;4: 8 ranked considerations per respondent and target, 4 sampled into each response draw; benchmark: Observed ANES 2024 Time Series pre-election feeling thermometers for the same respondents; metrics: RMSE, MAE, bias, correlation, mean and SD gaps by target, total variation and Wasserstein-1 distance between raw draws and observed ratings, within-respondent draw variation.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Design: methods comparison</text>
<g id="arm-Direct_persona_conditioned_thermometer_generation_Bisbee_et_al_2024_prompt_updated_for_2024_" data-text="Direct persona-conditioned thermometer generation (Bisbee et al. 2024 prompt, updated for 2024)">
